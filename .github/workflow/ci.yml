name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality-check:
    runs-on: ubuntu-lastest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync 
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run Bandit
        run: uv run bandit -r .
      - name: Run Mypy
        run: uv run mypy app.py